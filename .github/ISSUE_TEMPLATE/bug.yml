name: Gateway / model bug
description: A Cortex endpoint failed (use Hub → Bug report markdown)
labels: ["bug"]
body:
  - type: textarea
    id: report
    attributes:
      label: Hub bug report markdown
      description: Paste from Cortex Hub → Bug report. No API keys.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [OpenCode, Claude Code, Cowork, Cline, Roo, cursor-byok, TRAE, Hub only, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra
      description: What you expected. No prompts with secrets.
