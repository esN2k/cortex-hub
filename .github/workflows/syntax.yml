name: syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile
        run: python -m py_compile hub/server.py mcp/server.py mcp/client.py scripts/probe.py mcp/smoke.py
      - name: json
        run: python -c "import json,pathlib; json.loads(pathlib.Path('hub/catalog.json').read_text()); json.loads(pathlib.Path('config/opencode.json').read_text()); json.loads(pathlib.Path('examples/cursor-byok-preset.json').read_text())"
